################################################################################
## Tools
################################################################################

[tools]
# nvimv needs jq:
jq = "1.8.2"
"asdf:mise-plugins/mise-lua" = "5.1.5"
# Since busted is configured to run under "nvim", keep a default version
# installed. `test:version:no-prep` overrides it with `eval $(nvimv env VERSION)`,
# so ordinary commands do not need that dance:
neovim = "0.12.6"
"http:nvimv" = { version = "350b9aa", url = "https://raw.githubusercontent.com/jrop/nvimv/350b9aa4e1e77329a636f55851e2810fd142c9de/nvimv" }
stylua = "2.6.0"
# `mise run release` publishes through the gh CLI:
gh = "2.103.3"
cargo-binstall = "1.26.2"
"cargo:emmylua_ls" = { version = "0.25.1", depends = ["cargo-binstall"] }
"cargo:emmylua_check" = { version = "0.25.1", depends = ["cargo-binstall"] }

################################################################################
# Env
################################################################################

[env]
ASDF_LUA_LUAROCKS_VERSION = "3.12.2"
_.source = { path = "./scripts/env.sh", tools = true }

################################################################################
# Tasks
################################################################################

[tasks]
lint = "emmylua_check --warnings-as-errors --ignore '.prefix/**/*.*' ."
fmt = "stylua ."
"fmt:check" = "stylua --check ."
"test:prepare" = '''
# Install Lua test dependencies (busted, etc.):
luarocks test --prepare
echo

# Reinstall nightly only when the installed tag directory is older than a day.
# The directory's own mtime is the install time. The mtimes INSIDE the tarball
# are the upstream build times, already older than a day when published, so
# testing the binary's mtime would re-download the release on every run.
# -maxdepth 0 tests the directory itself without descending (BSD and GNU find
# both support it). The path mirrors nvimv's DATA_DIR so XDG_DATA_HOME and
# PREFIX both work:
nightly_dir="${XDG_DATA_HOME:-${PREFIX:-$HOME/.local}/share}/nvimv/tags/nightly"
if [ -n "$(find "$nightly_dir" -maxdepth 0 -mtime -1 2>/dev/null)" ]; then
  echo "Neovim Nightly is up-to-date"
else
  if nvimv ls | grep nightly >/dev/null; then
    nvimv upgrade nightly
  else
    nvimv install nightly
  fi
fi
echo
'''

[tasks."test:version:no-prep"]
hide = true
usage = '''
arg "<version>" help="The version of Neovim to test with"
'''
run = '''
echo
echo -----------------------------
echo -----------------------------
echo Neovim version=$usage_version
echo -----------------------------
echo -----------------------------
echo
nvimv install $usage_version
eval $(nvimv env $usage_version)
busted --verbose
'''

[tasks."test:version"]
depends = ["test:prepare"]
usage = '''
arg "<version>" help="The version of Neovim to test with"
'''
run = 'mise test:version:no-prep $usage_version'

[tasks."test"]
run = 'mise test:version 0.12.6'

[tasks."test:all"]
depends = ["test:prepare"]
run = '''
VERSIONS="0.10.4 0.11.7 0.12.6 nightly"
for v in $VERSIONS; do
  mise test:version:no-prep $v
done
'''

[tasks."test:coverage"]
depends = ["test:prepare"]
run = '''
rm -f ./luacov.*.*
busted --coverage --verbose
luacov
awk '/^Summary$/{flag=1;next} flag{print}' luacov.report.out
'''

[tasks."ci"]
run = '''
mise run fmt:check
mise run lint
mise run test:all
'''

[tasks.release]
description = "Publish the current v* tag as a GitHub release"
run = '''
set -eu

# `git describe` fails unless HEAD is exactly at a tag. Restricting the match
# to v* keeps unrelated tags from being mistaken for releases.
tag="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null || true)"
if [ -z "$tag" ]; then
  echo "release: HEAD must be at a v* tag" >&2
  exit 1
fi

git submodule update --init --recursive
if [ -n "$(git status --porcelain)" ]; then
  echo "release: working tree is not clean" >&2
  exit 1
fi

mise run ci

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

# The source constant is the version a checkout reports. Stamp the tag into a
# copy of the source tree, then bundle that copy with --bin. Bundling inlines
# the vendored modules, so the published asset stays one self-contained file;
# --bin adds the shebang, the modeline, and the executable bit.
mkdir -p "$tmp/src"
cp -R lua "$tmp/src/lua"
sed "s/^local VERSION = '.*'$/local VERSION = '${tag#v}'/" \
  "$tmp/src/lua/nvim-bundle.lua" > "$tmp/src/lua/nvim-bundle.lua.stamped"
mv "$tmp/src/lua/nvim-bundle.lua.stamped" "$tmp/src/lua/nvim-bundle.lua"
nvim --clean -l lua/nvim-bundle.lua \
  --bin --root "$tmp/src/lua" --out "$tmp/nvim-bundle" nvim-bundle

# Check the artifact through its shebang, not through `nvim -l`, so a broken
# executable or interpreter line is caught before the release is published.
"$tmp/nvim-bundle" --help >/dev/null
"$tmp/nvim-bundle" --version | grep -q "^nvim-bundle ${tag#v} (Neovim "

(
  cd "$tmp"
  if command -v sha256sum >/dev/null 2>&1; then
    sha256sum nvim-bundle > nvim-bundle.sha256
  else
    shasum -a 256 nvim-bundle > nvim-bundle.sha256
  fi
)

# --verify-tag refuses to create a release for a tag that has not been pushed,
# which keeps the uploaded artifact tied to the tag GitHub will serve.
gh release create "$tag" \
  "$tmp/nvim-bundle" \
  "$tmp/nvim-bundle.sha256" \
  --title "$tag" \
  --generate-notes \
  --verify-tag

echo "published $tag"
'''
