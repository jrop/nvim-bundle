################################################################################
## Tools
################################################################################

[tools]
"asdf:mise-plugins/mise-lua" = { version = "5.1.5", install_env = { ASDF_LUA_LUAROCKS_VERSION = "3.12.2" } }
"aqua:neovim/neovim" = "0.12.6"
stylua = "2.6.0"
gh = "2.103.3"
cargo-binstall = "1.26.2"
"cargo:emmylua_ls" = { version = "0.25.1", depends = ["cargo-binstall"] }
"cargo:emmylua_check" = { version = "0.25.1", depends = ["cargo-binstall"] }

################################################################################
# Tasks
################################################################################

[tasks]
fmt = "stylua ."
"fmt:check" = "stylua --check ."

[tasks."test:prepare"]
run = 'eval "$(luarocks path)" && luarocks test --prepare'

# The schemas are the source of truth for the DTO types, so the generated file
# is a build artifact and git-ignored. mise skips the task while the output is
# newer than every source, because guard's output is not byte-stable across
# runs and cannot be compared by content:
[tasks.generate]
description = "Generate LuaCATS types from the guard schemas"
sources = ["lua/nvim-bundle/dto.lua", "lua/nvim-bundle/vendor/guard.lua"]
outputs = ["lua/nvim-bundle/dto.types.lua"]
run = "nvim --clean -l lua/nvim-bundle/vendor/guard.lua --module nvim-bundle.vendor.guard lua/nvim-bundle/dto.lua"

[tasks.lint]
depends = ["generate"]
run = '''
export VIMRUNTIME="$(nvim --clean --headless +'lua io.write(vim.env.VIMRUNTIME)' +q)"
emmylua_check --warnings-as-errors .
'''

[tasks."test:version"]
depends = ["test:prepare"]
usage = 'arg "<version>"'
run = '''
tool="aqua:neovim/neovim@$usage_version"
[ "$usage_version" = nightly ] && tool='vfox:jdx/vfox-neovim@nightly'
# With auto-install off, `mise exec` on a missing version warns and runs the
# default `nvim` from PATH, so the suite would pass under the wrong version.
# Installing first makes a missing version an error instead.
mise install "$tool"
# The nightly tag moves, so refresh it when its checksum changed.
[ "$usage_version" = nightly ] && { mise upgrade "$tool" >/dev/null 2>&1 || true; }
eval "$(luarocks path)"
mise exec "$tool" -- busted --verbose
'''

[tasks."test"]
run = 'mise run test:version 0.12.6'

[tasks."test:all"]
depends = ["test:prepare"]
run = '''
for v in 0.10.4 0.11.7 0.12.6 nightly; do
  mise run test:version "$v"
done
'''

[tasks."test:coverage"]
depends = ["test:prepare"]
run = '''
rm -f ./luacov.*.*
eval "$(luarocks path)"
busted --coverage --verbose
luacov
awk '/^Summary$/{flag=1;next} flag{print}' luacov.report.out
'''

[tasks."test:fast"]
description = "Run busted against the default Neovim without preparing dependencies"
run = '''
eval "$(luarocks path)"
busted --verbose
'''

[tasks."ci"]
run = '''
mise run fmt:check
mise run lint
mise run test:all
'''

[tasks.release]
description = "Publish the current v* tag as a GitHub release"
run = '''
set -eu

# `--exact-match` refuses a commit that is not itself tagged, so the version
# stamped below always names this exact release.
tag="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null)" || {
  echo "release: HEAD must be at a v* tag" >&2
  exit 1
}

git submodule update --init --recursive
test -z "$(git status --porcelain)" || {
  echo "release: working tree is not clean" >&2
  exit 1
}

mise run ci

# Build with the checkout's own bundler. --bin adds the shebang, the modeline,
# and the executable bit, and inlines the vendored parser. The output name has
# no .lua extension because it is published as a command. The generated types
# are annotations only, so they stay out of the bundle. --define replaces the
# version that lua/nvim-bundle/version.lua reads, so the asset names this tag.
nvim --clean -l lua/nvim-bundle.lua \
  build --bin --root lua --out dist/nvim-bundle --exclude '**/*.types.lua' \
  --define "vim.g.nvim_bundle_version='${tag#v}'" nvim-bundle

# Only the bundle has the shebang and the inlined parser, so check those.
./dist/nvim-bundle --version | grep -q "^nvim-bundle ${tag#v} (Neovim "

# Hash from inside dist so the checksum names `nvim-bundle`.
(cd dist && shasum -a 256 nvim-bundle > nvim-bundle.sha256)

gh release create "$tag" \
  dist/nvim-bundle \
  dist/nvim-bundle.sha256 \
  --generate-notes \
  --verify-tag
'''
